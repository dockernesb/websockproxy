app = "websockproxy-aad1gw"
primary_region = "nrt"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8080
min_machines_running = 0
processes = [ "app" ]

[http_service.concurrency]
type = "connections"
soft_limit = 100
hard_limit = 200

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
memory_mb = 512
